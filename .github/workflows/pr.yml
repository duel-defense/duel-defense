name: Build Pull Request

on: pull_request

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup wine
      id: wine_install
      run: |
        sudo apt install wine64
        echo "WINE_PATH=$(which wine64)" >> $GITHUB_OUTPUT
    - name: Export Game
      id: export
      uses: firebelley/godot-export@v7.0.0
      with:
        godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
        godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
        relative_project_path: ./
        archive_output: true
        export_debug: true
        cache: true
        wine_path: ${{ steps.wine_install.outputs.WINE_PATH }}
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v6
      with:
        name: linux
        path: ${{ steps.export.outputs.archive_directory }}/LinuxX11.zip
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v6
      with:
        name: windows
        path: ${{ steps.export.outputs.archive_directory }}/Windows Desktop.zip
